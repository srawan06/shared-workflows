name: Reusable Python CI

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Summary
        run: echo "CI passed for ${{ inputs.app-name }}"
